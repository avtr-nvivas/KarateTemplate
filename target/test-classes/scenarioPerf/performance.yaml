loadType: closed
mode: sequence

features:
  - scenario: Home-Work
    feature: classpath:serviceApp/feature/HomeWork.feature@name=Home-Work
    requests:
      - Get-Articles
      - Post-Articles-ID-favorite
    enabled: true
    concurrency: low
    execution_time: low
    response_time: medium
    percentiles:
      p95: medium
      p99: high
    error_rate: low
    throughput: medium

  - scenario: Create-new-and-delete
    feature: classpath:serviceApp/feature/Articles.feature@name=Create-new-and-delete
    requests:
      - Create-Article
      - Delete-Article
    enabled: true
    concurrency: low
    execution_time: low
    response_time: medium
    percentiles:
      p95: medium
      p99: high
    error_rate: low
    throughput: medium

  - scenario: Get-10-articles
    feature: classpath:serviceApp/feature/HomePage.feature@name=Get-10-articles
    requests:
      - Get-Articles
      - Delete-Article
    enabled: true
    concurrency: low
    execution_time: low
    response_time: medium
    percentiles:
      p95: medium
      p99: high
    error_rate: low
    throughput: medium

  - scenario: Get-all-tags
    feature: classpath:serviceApp/feature/HomePage.feature@name=Get-all-tags
    requests:
      - Get-Tags
    enabled: true
    concurrency: low
    execution_time: low
    response_time: medium
    percentiles:
      p95: medium
      p99: high
    error_rate: low
    throughput: medium